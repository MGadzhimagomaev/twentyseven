<!--
  Supabase › Authentication › Emails: paste into both "Confirm signup" (first
  sign-in) and "Magic Link" (every sign-in after). Editing them needs your own
  email sender (custom SMTP).
  Subject:  Your 20/7 code: {{ .Token }}
  Body:     everything below this comment
-->
<div style="font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif; color: #101B25; max-width: 420px;">
  <p style="font-size: 14px; color: #51606D; margin: 0 0 8px;">20/7</p>
  <h2 style="font-size: 20px; margin: 0 0 16px;">Your sign-in code</h2>
  <p style="font-size: 34px; font-weight: 700; letter-spacing: 6px; margin: 0 0 16px;">{{ .Token }}</p>
  <p style="font-size: 15px; margin: 0 0 8px;">Enter it in 20/7 to sign in. It works for one hour.</p>
  <p style="font-size: 13px; color: #51606D; margin: 0;">If you didn't ask for this code, you can ignore this email.</p>
</div>
